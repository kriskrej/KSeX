name: Keep scheduled workflows alive

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1" # co poniedziałek, UTC

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create empty commit if repo is getting inactive
        run: |
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          NOW_TS=$(date +%s)
          AGE_DAYS=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))

          echo "Last commit age: $AGE_DAYS days"

          if [ "$AGE_DAYS" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows alive"
            git push
          else
            echo "No keepalive commit needed."
          fi